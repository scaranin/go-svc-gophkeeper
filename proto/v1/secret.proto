syntax = "proto3";

package gophkeeper.v1;

option go_package = "go-svc-gophkeeper/gen/go/v1;v1";

import "google/protobuf/timestamp.proto";
import "proto/v1/gophkeeper.proto";

service SecretService {
  rpc CreateSecret(CreateSecretRequest) returns (CreateSecretResponse);
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);
  rpc UpdateSecret(UpdateSecretRequest) returns (UpdateSecretResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  rpc Sync(SyncRequest) returns (SyncResponse);
}

message CreateSecretRequest {
  SecretType type = 1;
  string name = 2;
  Metadata metadata = 3;
  bytes encrypted_data = 4;
}

message CreateSecretResponse {
  string secret_id = 1;
  int32 version = 2;
  google.protobuf.Timestamp created_at = 3;
}

message GetSecretRequest {
  string secret_id = 1;
}

message GetSecretResponse {
  SecretInfo info = 1;
  bytes encrypted_data = 2;
}

message UpdateSecretRequest {
  string secret_id = 1;
  string name = 2;
  Metadata metadata = 3;
  bytes encrypted_data = 4;
  int32 version = 5;
}

message UpdateSecretResponse {
  int32 new_version = 1;
  google.protobuf.Timestamp updated_at = 2;
}

message DeleteSecretRequest {
  string secret_id = 1;
}

message DeleteSecretResponse {
  bool success = 1;
  google.protobuf.Timestamp deleted_at = 2;
}

message ListSecretsRequest {
  bool include_deleted = 1;
}

message ListSecretsResponse {
  repeated SecretInfo secrets = 1;
}

message SyncRequest {
  google.protobuf.Timestamp last_sync = 1;
}

message SyncResponse {
  repeated SecretInfo secrets = 1;
  SyncState sync_state = 2;
}